name: CI

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag for a draft release (empty builds main)
        type: string
        required: false
      sync_cask:
        description: Sync Homebrew with the published release (skip app build)
        type: boolean
        default: false
      cask_check:
        description: Check a cask automation commit against its parent
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name != 'release' && !inputs.sync_cask
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      tag: ${{ steps.source.outputs.tag }}
      build: ${{ steps.changes.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed files
        id: changes
        env:
          CI_EVENT: ${{ inputs.cask_check && 'cask' || github.event_name }}
          CI_IS_TAG: ${{ github.ref_type == 'tag' || inputs.tag != '' }}
          CI_BASE: ${{ inputs.cask_check && 'HEAD^' || github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.sha }}
        run: make ci-changes
      - name: Check tools and source formatting
        run: make check
      - name: Validate release tag
        if: env.RELEASE_TAG != ''
        run: make validate-release
      - name: Record source identity
        id: source
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: checks
    if: needs.checks.outputs.build == 'true'
    runs-on: xcode-27
    timeout-minutes: 360
    concurrency:
      group: ci-build-${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type != 'tag') }}
    env:
      EXPECTED_COMMIT: ${{ needs.checks.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.checks.outputs.commit }}
          persist-credentials: false
      - name: Build, test and verify release assets
        run: make ci JOBS=2
      - name: Retain release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kwi-macos-arm64-${{ needs.checks.outputs.commit }}
          path: build-macos/release-assets/
          if-no-files-found: error
          retention-days: 3
      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-diagnostics-${{ github.run_id }}
          path: |
            build-macos/craft-root/logs/
            build-macos/craft-root/build/kwi/kwi/**/CMakeConfigureLog.yaml
            build-macos/craft-root/etc/kwi-craft-patch.json
            build-macos/dependencies.json
            build-macos/native-tests.xml
            build-macos/package.log
          if-no-files-found: ignore
          retention-days: 14

  draft:
    needs: [checks, build]
    if: needs.checks.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-${{ needs.checks.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.checks.outputs.tag }}
      EXPECTED_COMMIT: ${{ needs.checks.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.checks.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kwi-macos-arm64-${{ needs.checks.outputs.commit }}
          path: build-macos/release-assets
      - name: Verify assets and prepare draft
        run: make release

  cask:
    if: >-
      github.repository == 'MohamedElashri/kwi-mac' &&
      ((github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease) ||
       (github.event_name == 'workflow_dispatch' && inputs.sync_cask))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: homebrew-cask-sync
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Update cask and open signed pull request
        run: make sync-cask
