name: macOS release

on:
  push:
    tags: ['v*-mac.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag, e.g. v0.1.0-mac.1
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - name: Validate release tag format
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-mac\.[0-9]+$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Record the existing tag commit
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    uses: ./.github/workflows/macos-arm64.yml
    with:
      ref: ${{ needs.validate.outputs.commit }}

  draft:
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kwi-macos-arm64-${{ needs.build.outputs.commit }}
          path: release-assets
      - name: Verify source identity and archive checksum
        env:
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
          BUILT_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          test "$EXPECTED_COMMIT" = "$BUILT_COMMIT"
          cd release-assets
          sha256sum -c SHA256SUMS
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('package.json').read_text())
          assert manifest['source']['source_commit'] == os.environ['EXPECTED_COMMIT']
          assert manifest['full_deployment']
          assert manifest['strict_signatures_original_and_extracted']
          assert manifest['archive_round_trip_bytes_modes_symlinks']
          PY
      - name: Create or refresh a draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.txt <<EOF
          Apple Silicon macOS build of the Kwi port.

          Source: $SOURCE_COMMIT
          Extract Kwi.app from Kwi-arm64.zip and copy it to Applications.
          Ad-hoc signed; Developer ID signing and notarization are not configured.
          Headless CI tests and package audits pass. GUI/Metal checks remain local.
          Review the bundled dependency notices and source requirements before publishing this draft.
          EOF
          if state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            test "$state" = true || { echo 'Refusing to replace a published release'; exit 1; }
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --draft --prerelease --notes-file release-notes.txt
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag \
              --title "Kwi for macOS $RELEASE_TAG" --draft --prerelease \
              --notes-file release-notes.txt
          fi
