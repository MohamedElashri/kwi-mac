name: CI

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag for a draft release (empty builds main)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type != 'tag') }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check tools and source formatting
        run: make check
      - name: Validate release tag
        if: env.RELEASE_TAG != ''
        run: make validate-release
      - name: Record source identity
        id: source
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: checks
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      EXPECTED_COMMIT: ${{ needs.checks.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.checks.outputs.commit }}
          persist-credentials: false
      - name: Build, test and verify release assets
        run: make ci JOBS=2
      - name: Retain release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kwi-macos-arm64-${{ needs.checks.outputs.commit }}
          path: build-macos/release-assets/
          if-no-files-found: error
          retention-days: 3
      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-diagnostics-${{ github.run_id }}
          path: |
            build-macos/craft-root/logs/
            build-macos/craft-root/build/kwi/kwi/**/CMakeConfigureLog.yaml
            build-macos/craft-root/etc/kwi-craft-patch.json
            build-macos/dependencies.json
            build-macos/native-tests.xml
            build-macos/package.log
          if-no-files-found: ignore
          retention-days: 14

  draft:
    needs: [checks, build]
    if: needs.checks.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.checks.outputs.tag }}
      EXPECTED_COMMIT: ${{ needs.checks.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.checks.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kwi-macos-arm64-${{ needs.checks.outputs.commit }}
          path: build-macos/release-assets
      - name: Verify assets and prepare draft
        run: make release
