name: Release Zirq
run-name: Zirq release · ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.3.0
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify Zirq
    uses: ./.github/workflows/checks.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}

  draft:
    name: Prepare release draft
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      EXPECTED_COMMIT: ${{ needs.build.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zirq-macos-arm64-${{ needs.build.outputs.commit }}
          path: build-macos/release-assets
      - name: Verify assets and prepare draft
        run: make release
